name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse standard
        run: npm run parse

      - name: Build CSS
        run: npm run css

      - name: Build site
        run: npm run eleventy

      # The whole site in one artifact: Thomas's landing and its project pages at the root, the reference site under
      # /src/ (where the landing links it), the measurement and the credits.
      - name: Assemble the whole site
        run: |
          cp index.html savings.html NOTICE LICENSE README.md QUICKSTART.md llms.txt robots.txt sitemap.xml TAG_DB_v3_PlantPAx.html dist/
          cp -r build-prompts gitplc konomi-p2p dist/
          mkdir -p dist/measure && cp -r measure/data dist/measure/
          touch dist/.nojekyll

      - name: Every local link and asset resolves
        run: node scripts/check-links.mjs dist /KonomiStandard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
